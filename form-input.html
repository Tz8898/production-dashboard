<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Produksi</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 500px; margin: 0 auto; background: #f0f2f5; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        .success { background: #28a745; color: white; padding: 10px; margin-top: 10px; display: none; border-radius: 5px; }
        .error { background: #dc3545; color: white; padding: 10px; margin-top: 10px; display: none; border-radius: 5px; }
        h1 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <h1>📋 Input Produksi Harian</h1>
    
    <form id="myForm">
        <div class="form-group">
            <label>Line Produksi *</label>
            <select id="line" required>
                <option value="">Pilih Line</option>
                <option value="Line 1">Line 1</option>
                <option value="Line 2">Line 2</option>
                <option value="Line 3">Line 3</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nama Produk *</label>
            <input type="text" id="productName" required>
        </div>

        <div class="form-group">
            <label>Berat Produk (kg) *</label>
            <input type="number" id="productWeight" step="0.01" required>
        </div>

        <div class="form-group">
            <label>Target Produksi *</label>
            <input type="number" id="target" required>
        </div>

        <div class="form-group">
            <label>Actual Produksi *</label>
            <input type="number" id="actual" required>
        </div>

        <div class="form-group">
            <label>Reject (%)</label>
            <input type="number" id="reject" step="0.1" value="0">
        </div>

        <div class="form-group">
            <label>Downtime (%)</label>
            <input type="number" id="downtime" step="0.1" value="0">
        </div>

        <div class="form-group">
            <label>Deskripsi Defect (isi jika reject > 0)</label>
            <textarea id="defectDesc" rows="2"></textarea>
        </div>

        <div class="form-group">
            <label>Deskripsi Breakdown (isi jika downtime > 0)</label>
            <textarea id="breakdownDesc" rows="2"></textarea>
        </div>

        <div class="form-group">
            <label>Operator</label>
            <input type="text" id="operator">
        </div>

        <button type="submit">📤 KIRIM KE GOOGLE SHEETS</button>
    </form>

    <div id="successMsg" class="success">✅ Data berhasil dikirim!</div>
    <div id="errorMsg" class="error">❌ Gagal mengirim data</div>

    <script>
        // ========== GANTI URL INI ==========
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbww17JnzMPwX58HcXDA_7neXPm77idHoONI5H_wJ565qMgF_OzSLHi9olQe5WFlLnYE/exec";
        // ===================================

        const form = document.getElementById('myForm');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const now = new Date();
            const target = parseInt(document.getElementById('target').value);
            const actual = parseInt(document.getElementById('actual').value);
            const achievement = ((actual / target) * 100).toFixed(1);

            const data = {
                timestamp: now.toISOString(),
                date: now.toLocaleDateString('id-ID'),
                time: now.toLocaleTimeString('id-ID'),
                line: document.getElementById('line').value,
                productName: document.getElementById('productName').value,
                productWeight: parseFloat(document.getElementById('productWeight').value).toFixed(2),
                target: target,
                actual: actual,
                reject: parseFloat(document.getElementById('reject').value) || 0,
                downtime: parseFloat(document.getElementById('downtime').value) || 0,
                air: 0,
                electric: 0,
                steam: 0,
                defectDesc: document.getElementById('defectDesc').value || "-",
                breakdownDesc: document.getElementById('breakdownDesc').value || "-",
                correctiveAction: "-",
                operator: document.getElementById('operator').value || "-",
                achievement: achievement
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                successMsg.style.display = 'block';
                errorMsg.style.display = 'none';
                form.reset();
                setTimeout(() => successMsg.style.display = 'none', 3000);
                
            } catch(error) {
                errorMsg.style.display = 'block';
                setTimeout(() => errorMsg.style.display = 'none', 3000);
            }
        });
    </script>
</body>
</html>
